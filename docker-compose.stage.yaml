services:
  hlasys2:
    build:
      context: .
      args:
        HLASYS2_COMMIT_HASH: ${HLASYS2_COMMIT_HASH:-unknown}
    image: hlasys2:stage
    ports:
      - "5001:5000"
    volumes:
      - ./instance:/hlasys2/instance
      - ./hlasys2_app/config.py:/hlasys2/hlasys2_app/config.py:ro
      - ./client_secrets.json:/hlasys2/client_secrets.json:ro
    restart: unless-stopped
