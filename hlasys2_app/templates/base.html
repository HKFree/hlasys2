<!DOCTYPE html>
<html lang="cs-cz">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

        <title>{% block title %}{% endblock title %} - HlaSys v2</title>

        {% block head %}{% endblock head %}
    </head>
    <body>
        <nav>
            <div class="nav-content">
                <h1>HlaSys v2</h1>
                <ul>
                    <li><a href="{{ url_for('proposals.overview', filter='vvsopdkk') }}">Přehled</a>
                    <li><a href="{{ url_for('users.user_ovreview', user_id=session['user_id']) }}">Moje timeline</a>
                    <li><a href="{{ url_for('proposals.create_proposal') }}">Nový návrh</a>
                </ul>
            </div>
        </nav>
        <section class="content">
            <header>
                {% block header %}{% endblock %}
            </header>
            {% for message in get_flashed_messages() %}
            <div class="flash">{{ message }}</div>
            {% endfor %}
            {% block content %}{% endblock %}
            <footer>HlaSys v2 | pro <a href="https://hkfree.org">hkfree.org</a> vyrobil OndraLhota</footer>
        </section>
        
    </body>
</html>
